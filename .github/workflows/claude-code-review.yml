name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Run when 'review-requested' label is added, when a labeled PR is force-pushed
    # (synchronize), or when manually dispatched. Synchronize arm ensures rebased
    # branches get reviewed without requiring a manual label cycle.
    #
    # NOTE: PRs that modify .github/workflows/claude-code-review.yml will always fail
    # with a 401 "Workflow validation failed" error — this is an intentional security
    # check in the action (prevents self-modifying PRs from bypassing review), because
    # the action requires the workflow file on the PR branch to match the default-branch
    # version exactly. Such a PR cannot pass its own review check. Once `ci` is green,
    # admin-merge it: `gh pr merge <N> --squash --delete-branch --admin`. Do NOT reach
    # for the 'no-review' label here — that label is reserved for docs/skill/config-only
    # changes, and using it to bypass review on a workflow edit hides a real gap.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'review-requested') ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'review-requested'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@459ad358ae43fea66bfefd0a1f8d840b4b9791fb # v1.0.194
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this, every Dependabot-pushed rebase fails the run outright with
          # "Workflow initiated by non-human actor: dependabot" — the synchronize arm
          # fires with github.actor == dependabot[bot], and the action rejects non-human
          # actors unless allow-listed. The check went red on the actor policy, not on
          # the diff, and the only workaround was manually cycling review-requested so
          # the label-add made a human the actor (see #284).
          #
          # Scoped to Dependabot, NOT '*': this repo is public, and the action's own
          # input docs warn that '*' on a public repo may let external Apps invoke it
          # with prompts they control. Note that Dependabot PR bodies embed upstream
          # release notes, which a malicious package could craft — the allowed-tools
          # list below is read-only plus `gh pr comment`, so the blast radius of an
          # injected prompt is a misleading comment, not a write.
          #
          # This alone is not sufficient: Dependabot-triggered runs read secrets from
          # the Dependabot store, not Actions ("Secret source: Dependabot" in the job
          # log), so CLAUDE_CODE_OAUTH_TOKEN must also be set there via
          #   gh secret set CLAUDE_CODE_OAUTH_TOKEN --app dependabot
          # or the actor gate passes and the run fails on auth instead.
          allowed_bots: 'dependabot[bot]'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          claude_args: '--allowed-tools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
