name: Deploy to Production

# Deploy runs ONLY for releases — never on plain pushes to mainline:
#   - automatically when a version tag (v*) is pushed
#   - manually via workflow_dispatch (the /deploy skill), which deploys the
#     latest version tag
# In both cases the full CI quality gate runs against the release tag's
# code first; the deploy steps run only if every check passes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only one deployment at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve and check out release tag
        # Pass trigger context via env, never interpolate ${{ }} into the
        # shell — a crafted tag name would otherwise be executed.
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GH_EVENT" = "push" ]; then
            # Tag push — deploy exactly the tag that was pushed.
            TAG="$GH_REF_NAME"
          else
            # Manual dispatch — deploy the latest version tag.
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No version tag found to deploy"
            exit 1
          fi
          git checkout --quiet "refs/tags/$TAG"
          # The tag and package.json version must agree, or the deployed
          # version metadata would be wrong. Read without node (not set up yet).
          PKG_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version (v$PKG_VERSION)"
            exit 1
          fi
          echo "Deploying release tag: $TAG ($(git rev-parse --short HEAD))"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── CI quality gate — deploy proceeds only if all of these pass ──
      # Mirrors ci.yml; kept inline so the gate runs against the release
      # tag's code rather than whatever ref triggered the workflow.
      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_ESRI_API_KEY: ${{ secrets.VITE_ESRI_API_KEY }}
          VITE_THUNDERFOREST_TOKEN: ${{ secrets.VITE_THUNDERFOREST_TOKEN }}
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html not found"; exit 1; }
          grep -q 'type="module"' dist/index.html || { echo "ERROR: Missing type=module in dist/index.html"; exit 1; }
          echo "Build verification passed"

      - name: Bundle size check
        run: npm run size

      # ── Deploy — only reached when every gate step above passed ──
      - name: Create deployment package
        run: tar -czf webmap-deploy.tar.gz -C dist .

      - name: Setup SSH key and verified host key
        # DEPLOY_KNOWN_HOSTS is a known_hosts entry verified out-of-band
        # against the server's real host key — never fetched at deploy time
        # (no ssh-keyscan / trust-on-first-use), so a MITM'd or replaced
        # server fails host-key verification instead of receiving the build.
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_KEY secret is not set"
            exit 1
          fi
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS secret is not set — refusing to deploy without a verified host key"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=60 -o ServerAliveInterval=30"
          SSH_TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          VERSION=$(node -p "require('./package.json').version")
          DEPLOY_SHA=$(git rev-parse HEAD)

          source "$GITHUB_WORKSPACE/scripts/ssh-retry.sh"

          # Stage into a private, unpredictable directory rather than a fixed
          # /tmp path. The nginx conf is installed as root and loaded into an
          # nginx instance shared with other vhosts, so another local account
          # must not be able to pre-create the path and plant a file there.
          # `mkdir` (no -p) fails if the path already exists, and the name
          # carries 128 bits of randomness, so this fails closed.
          #
          # This deliberately does NOT use ssh_retry: that retries the *same*
          # command, and a non-idempotent mkdir would then fail deterministically
          # whenever the connection blips after the remote mkdir already
          # succeeded — aborting an otherwise healthy release. Each attempt gets
          # a fresh random suffix instead, so a retry always targets a new path.
          # A blip can leave behind one empty 0700 dir; harmless, and we cannot
          # safely remove it because we do not know the mkdir landed.
          STAGE=""
          STAGE_DELAYS=(5 15 30)
          for attempt in 1 2 3; do
            # `set -e` does not trip on a failed substitution inside an
            # assignment, so validate the shape rather than trusting openssl.
            CANDIDATE="/tmp/webmap-deploy-$(openssl rand -hex 16 || true)"
            if [[ ! "$CANDIDATE" =~ ^/tmp/webmap-deploy-[0-9a-f]{32}$ ]]; then
              echo "::error::could not generate a random staging path (openssl failed?)"
              exit 1
            fi
            echo "Staging dir attempt $attempt/3..."
            if ssh $SSH_OPTS "$SSH_TARGET" "mkdir -m 700 '$CANDIDATE'"; then
              STAGE="$CANDIDATE"
              break
            fi
            # Not `[ ... ] && sleep` — that returns 1 on the last attempt and
            # would trip `set -e` as the final command in the loop body.
            if [ "$attempt" -lt 3 ]; then
              sleep "${STAGE_DELAYS[$((attempt - 1))]}"
            fi
          done
          if [ -z "$STAGE" ]; then
            echo "::error::could not create a staging directory after 3 attempts"
            exit 1
          fi

          ssh_retry "scp $SSH_OPTS scripts/deploy-webmap.sh $SSH_TARGET:$STAGE/deploy-webmap.sh"
          # Ship the repo's nginx conf alongside the content so the host can
          # never drift from what is checked in. deploy-webmap.sh validates it
          # with `nginx -t` and only reloads when it changed and passes.
          ssh_retry "scp $SSH_OPTS infrastructure/nginx/www.webmap.dev.conf $SSH_TARGET:$STAGE/www.webmap.dev.conf"

          set +e
          ssh_retry "cat webmap-deploy.tar.gz | ssh $SSH_OPTS $SSH_TARGET 'DEPLOY_SHA=$DEPLOY_SHA DEPLOY_VERSION=$VERSION NGINX_CONF_SRC=$STAGE/www.webmap.dev.conf bash $STAGE/deploy-webmap.sh'"
          DEPLOY_RC=$?
          set -e

          # Always clear the staging dir, success or failure — it holds nothing
          # secret, but leaving predictable-lifetime dirs around is untidy.
          ssh_retry "ssh $SSH_OPTS $SSH_TARGET 'rm -rf \"$STAGE\"'" || true

          exit $DEPLOY_RC

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Smoke test
        run: |
          echo "Waiting 5s for nginx to settle..."
          sleep 5
          MAX_RETRIES=6
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -sf --max-time 15 -o /dev/null -w '%{http_code}' "https://www.webmap.dev" 2>/dev/null || echo '0')
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Smoke test passed (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" = "$MAX_RETRIES" ]; then
              echo "::error::Smoke test failed after $MAX_RETRIES attempts (last HTTP code: $HTTP_CODE)"
              exit 1
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
