<!DOCTYPE html>
<html lang="en">
<head>
  <title>webmap.dev</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="GPS mapping with turn-by-turn navigation and offline support">

  <meta property="og:type" content="website">
  <meta property="og:title" content="webmap.dev">
  <meta property="og:description" content="GPS navigation. Offline maps. No account.">
  <meta property="og:image" content="https://webmap.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="webmap.dev — GPS navigation, offline maps, no account">
  <meta property="og:url" content="https://webmap.dev/">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="webmap.dev">
  <meta name="twitter:description" content="GPS navigation. Offline maps. No account.">
  <meta name="twitter:image" content="https://webmap.dev/og-image.png">
  <meta name="twitter:image:alt" content="webmap.dev — GPS navigation, offline maps, no account">

  <link rel="icon" type="image/svg+xml" href="/logo-color-v1.1.svg">
  <!-- The web app manifest link is injected automatically by vite-plugin-pwa
       at build time (it owns manifest.webmanifest). Do not hardcode it here —
       a second link duplicates it in the build, and in dev (SW disabled) it
       404s to the HTML fallback, which the browser reports as a manifest
       "Line 1, column 1, Syntax error". -->

  <!-- Boot watchdog: if the JS bundle never executes (e.g. a stale service worker
       serving a 404'd chunk → blank page), main.ts never calls __webmapBootOk, and
       this reloads once (sessionStorage-guarded) to recover instead of leaving the
       user stranded. var is intentional (broadest engine support so recovery can't
       itself break). -->
  <script>
    (function () {
      var KEY = 'webmap-boot-watchdog';
      var timer;
      window.__webmapBootOk = function () {
        if (timer) { clearTimeout(timer); }
        try { sessionStorage.removeItem(KEY); } catch (e) { /* unavailable */ }
      };

      var reloadedOnce;
      try { reloadedOnce = sessionStorage.getItem(KEY) === '1'; } catch (e) { reloadedOnce = false; }
      if (!reloadedOnce) {
        timer = setTimeout(function () {
          var persisted = false;
          try { sessionStorage.setItem(KEY, '1'); persisted = true; } catch (e) { persisted = false; }
          if (persisted) { location.reload(); }
        }, 3000);
      }
    })();
  </script>
</head>
<body>
  <div id="map"></div>

  <!-- Gamma-2 curve for the Cycle base map (see .self-multiply in style.css).
       feComponentTransfer with exponent 2 computes c^2 per channel, which is exactly
       what mix-blend-mode: multiply produced back when the Cycle blend overlay
       composited the Cycle base over its own source — the same pixels from one tile
       fetch instead of two. (#305)
       color-interpolation-filters="sRGB" is required, not decoration: filters default
       to linearRGB, which would NOT match multiply's sRGB result. Alpha is left alone
       (no feFuncA) — the curve belongs on color, and these tiles are opaque anyway.
       Paints nothing itself (zero-size, no rendered content), so unlike #map it adds
       no compositing layer at first paint. -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true"
       focusable="false" style="position:absolute">
    <filter id="webmap-self-multiply" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="gamma" exponent="2"/>
        <feFuncG type="gamma" exponent="2"/>
        <feFuncB type="gamma" exponent="2"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <!-- #offline-banner is created lazily by main.ts only when the app goes offline.
       Keeping it out of the static HTML avoids a position:fixed+transform compositing
       layer at first paint, which (with #map) contributed to the iOS-26 WKWebView
       whole-page render freeze. -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
