<!DOCTYPE html>
<html lang="en">
<head>
  <title>webmap.dev</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="GPS mapping and trail recording with offline support">

  <meta property="og:type" content="website">
  <meta property="og:title" content="webmap.dev">
  <meta property="og:description" content="Record GPS trails. Offline maps. No account.">
  <meta property="og:image" content="https://webmap.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="webmap.dev — record GPS trails, offline maps, no account">
  <meta property="og:url" content="https://webmap.dev/">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="webmap.dev">
  <meta name="twitter:description" content="Record GPS trails. Offline maps. No account.">
  <meta name="twitter:image" content="https://webmap.dev/og-image.png">
  <meta name="twitter:image:alt" content="webmap.dev — record GPS trails, offline maps, no account">

  <link rel="icon" type="image/svg+xml" href="/logo-color-v1.1.svg">
  <!-- The web app manifest link is injected automatically by vite-plugin-pwa
       at build time (it owns manifest.webmanifest). Do not hardcode it here —
       a second link duplicates it in the build, and in dev (SW disabled) it
       404s to the HTML fallback, which the browser reports as a manifest
       "Line 1, column 1, Syntax error". -->

  <!-- Boot watchdog + on-screen diagnostic. The watchdog reloads once if the JS
       bundle never executes (stale SW serving a 404'd chunk → blank). The diag
       overlay surfaces uncaught errors and a blank-state dump on devices we can't
       remote-inspect (mobile Chromium). TEMPORARY instrumentation — remove once
       the blank-on-load root cause is identified. var is intentional (broadest
       engine support so recovery never breaks). -->
  <script>
    (function () {
      var KEY = 'webmap-boot-watchdog';
      var timer;
      window.__webmapBootOk = function () {
        window.__WEBMAP_RAN__ = true; // the bundle executed
        if (timer) { clearTimeout(timer); }
        try { sessionStorage.removeItem(KEY); } catch (e) { /* unavailable */ }
      };

      function diag(title, body) {
        try {
          var el = document.getElementById('webmap-diag');
          if (!el) {
            el = document.createElement('div');
            el.id = 'webmap-diag';
            el.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;background:#101418;color:#7CFC00;font:11px/1.45 ui-monospace,Menlo,monospace;padding:14px;overflow:auto;white-space:pre-wrap;word-break:break-word;');
            (document.body || document.documentElement).appendChild(el);
            el.textContent = 'webmap.dev diagnostic — please screenshot\n';
          }
          el.textContent += '\n' + title + '\n' + (body || '') + '\n';
        } catch (e) { /* ignore */ }
      }
      window.addEventListener('error', function (e) {
        diag('[error] ' + (e.message || ''), (e.error && e.error.stack) ? e.error.stack : ((e.filename || '') + ':' + e.lineno + ':' + e.colno));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        diag('[promise] ' + ((r && r.message) || ''), (r && r.stack) ? r.stack : String(r));
      });

      var reloadedOnce;
      try { reloadedOnce = sessionStorage.getItem(KEY) === '1'; } catch (e) { reloadedOnce = false; }
      if (!reloadedOnce) {
        timer = setTimeout(function () {
          var persisted = false;
          try { sessionStorage.setItem(KEY, '1'); persisted = true; } catch (e) { persisted = false; }
          if (persisted) { location.reload(); }
        }, 3000);
      }

      // Render-freeze self-heal. iOS WebKit (iOS 26 / WKWebView — e.g. Edge & Chrome
      // on iOS) intermittently loads the page into a frozen render process: the DOM is
      // complete and the bundle runs, but the whole content area stays white and ONLY
      // a reload (not scroll/touch/rotate) clears it. The Paint Timing API records a
      // 'first-contentful-paint' entry only when WebKit actually paints content; if
      // it's still absent ~3s in, the page froze — reload once (guarded) to recover.
      // This complements the boot-watchdog above (which covers a bundle that never
      // runs); here the bundle runs fine but the render is dead until a fresh load.
      var RKEY = 'webmap-render-reload';
      setTimeout(function () {
        var painted;
        try {
          painted = performance.getEntriesByType('paint').some(function (p) {
            return p.name === 'first-contentful-paint';
          });
        } catch (e) { painted = true; } // no Paint Timing API → never risk a reload loop
        if (painted) { try { sessionStorage.removeItem(RKEY); } catch (e) {} return; }
        var rAlready;
        try { rAlready = sessionStorage.getItem(RKEY) === '1'; } catch (e) { rAlready = false; }
        if (!rAlready) {
          // Only reload if the guard actually persisted — if sessionStorage is
          // unavailable (private mode, storage disabled), reloading would loop
          // forever. Mirrors the boot-watchdog above. (Key: 'webmap-render-reload'.)
          var rPersisted = false;
          try { sessionStorage.setItem(RKEY, '1'); rPersisted = true; } catch (e) { rPersisted = false; }
          if (rPersisted) { location.reload(); }
        }
      }, 3000);

      // Blank-state probe: if the map still hasn't rendered after 5s and no error
      // was captured, dump enough state to see WHY it's blank.
      setTimeout(function () {
        // Append state when the page is plausibly broken: either an error was
        // already shown, OR no base-map tiles rendered. (Leaflet adds panes and
        // controls to #map immediately, so childElementCount > 0 even on a blank
        // white map — count actually-loaded tiles instead.) Stay quiet only on a
        // healthy load (tiles present AND no error) so working maps aren't covered.
        var hadError = !!document.getElementById('webmap-diag');
        var m = document.getElementById('map');
        var tiles = m ? m.querySelectorAll('.leaflet-tile-loaded').length : 0;
        if (!hadError && tiles > 0) { return; }
        var sw = navigator.serviceWorker;
        function ls(k) { try { return !!localStorage.getItem(k); } catch (e) { return 'n/a'; } }
        var script = document.querySelector('script[type=module]');
        var co = document.getElementById('consent-overlay');
        var coState = 'absent';
        if (co) { var cr = co.getBoundingClientRect(); coState = Math.round(cr.width) + 'x' + Math.round(cr.height); }
        var kids = [];
        var bk = document.body ? document.body.children : [];
        for (var i = 0; i < bk.length; i++) { kids.push(bk[i].id || bk[i].tagName); }
        diag('[blank-probe] state', [
          'bundleRan=' + !!window.__WEBMAP_RAN__,
          'onLine=' + navigator.onLine,
          'readyState=' + document.readyState,
          'mapChildren=' + (m ? m.childElementCount : -1),
          'loadedTiles=' + tiles,
          'hasConsent=' + ls('webmap-consent-version'),
          'consentOverlay=' + coState,
          'bodyKids=' + kids.join(','),
          'swController=' + (sw && sw.controller ? 'yes' : 'no'),
          'asset=' + (script ? script.src : '?'),
          'ua=' + navigator.userAgent
        ].join('\n'));
      }, 5000);
    })();
  </script>
</head>
<body>
  <div id="map"></div>
  <div id="offline-banner" class="offline-banner">
    <span>You are offline — cached tiles and GPS recording still work</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
