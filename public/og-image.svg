<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="topo" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <circle cx="120" cy="120" r="100" fill="none" stroke="#334155" stroke-width="1"/>
      <circle cx="120" cy="120" r="70"  fill="none" stroke="#334155" stroke-width="1"/>
      <circle cx="120" cy="120" r="40"  fill="none" stroke="#334155" stroke-width="1"/>
      <circle cx="120" cy="120" r="15"  fill="none" stroke="#334155" stroke-width="1"/>
    </pattern>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4287f5" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#4287f5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4287f5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#topo)" opacity="0.45"/>

  <text x="80" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="108" font-weight="800" fill="#ffffff" letter-spacing="-2">webmap.dev</text>

  <text x="80" y="335" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="400" fill="#94a3b8">Record GPS trails. Offline maps. No account.</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    <g transform="translate(80, 420)">
      <rect width="200" height="52" rx="26" fill="#1e3a8a" opacity="0.5"/>
      <text x="100" y="33" text-anchor="middle" fill="#bfdbfe">Real-time GPS</text>
    </g>
    <g transform="translate(296, 420)">
      <rect width="180" height="52" rx="26" fill="#14532d" opacity="0.5"/>
      <text x="90" y="33" text-anchor="middle" fill="#bbf7d0">GPX export</text>
    </g>
    <g transform="translate(492, 420)">
      <rect width="220" height="52" rx="26" fill="#7c2d12" opacity="0.5"/>
      <text x="110" y="33" text-anchor="middle" fill="#fed7aa">Works offline</text>
    </g>
  </g>

  <g transform="translate(960, 280)">
    <circle cx="0" cy="0" r="180" fill="url(#pulse)"/>
    <circle cx="0" cy="0" r="110" fill="#4287f5" opacity="0.18"/>
    <circle cx="0" cy="0" r="62"  fill="#4287f5" opacity="0.32"/>
    <circle cx="0" cy="0" r="28"  fill="#4287f5" stroke="#ffffff" stroke-width="5"/>
  </g>

  <text x="80" y="560" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="22" font-weight="500" fill="#64748b">PWA · privacy-first · open source</text>
</svg>
